name: Windows QA helper safety tests

on:
  pull_request:
    paths:
      - 'qa/disposable-node/windows/**'
      - '.github/workflows/windows-qa-helper.yml'

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pycdlib==1.22.0
      - run: python -m unittest discover -s qa/disposable-node/windows -p test_asr_vm.py -v
