name: Doug QA Linux package

on:
  workflow_dispatch:
  push:
    branches:
      - codex/doug-bug-fixes

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/codex/doug-bug-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the QA branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the release gate and build the archive
        run: ./build-release.sh

      - name: Verify the generated checksum
        run: cd release && sha256sum --check *.tar.gz.sha256

      - name: Upload Doug's QA package
        uses: actions/upload-artifact@v4
        with:
          name: doug-qa-${{ github.sha }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the test-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload doug-qa-2026-10-15 \
            release/*.tar.gz release/*.tar.gz.sha256 --clobber
          gh release edit doug-qa-2026-10-15 --draft=false --prerelease
