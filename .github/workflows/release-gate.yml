name: Release gate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate and build archive
        run: ./build-release.sh

      - name: Verify generated checksum
        run: cd release && sha256sum --check *.tar.gz.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
