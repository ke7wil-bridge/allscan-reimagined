services:
  layered-allscan:
    build:
      context: .
      dockerfile: Dockerfile.layered
    env_file:
      - .env
    ports:
      - "4173:80"
    networks:
      - default
      - asl3
    volumes:
      - layered-web:/var/www/html
      - layered-allscan-data:/etc/allscan
      - layered-asr-config:/etc/allscan-reimagined
      # Preserve the root-only node-wide TGIF web session across container recreation.
      - layered-asr-state:/var/lib/allscan-reimagined
      # Narrow Unix socket only; the web tier never receives Docker's socket.
      - ${ASR_HOST_PROVISIONING_DIR:-/run/allscan-reimagined-host}:/run/allscan-reimagined-host:ro
      - /run/allscan-reimagined-bridge-control:/run/allscan-reimagined-bridge-control:ro
      - /run/allscan-reimagined-ysf-bridge-control:/run/allscan-reimagined-ysf-bridge-control:ro
      - /run/allscan-reimagined-p25-bridge-control:/run/allscan-reimagined-p25-bridge-control:ro
      - /run/allscan-reimagined-nxdn-bridge-control:/run/allscan-reimagined-nxdn-bridge-control:ro
      - /run/allscan-reimagined-m17:/run/allscan-reimagined-m17:ro
      - ${ASR_DMR_STATUS_DIR:-/run/tgif-dmr}:/run/dmr-bridge:ro

volumes:
  layered-web:
  layered-allscan-data:
  layered-asr-config:
  layered-asr-state:

networks:
  asl3:
    external: true
    name: asl3-docker_default
