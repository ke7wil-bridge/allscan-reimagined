# Netoholics high-capacity UDP audio buffers (#346)
# Install on every hub as /etc/sysctl.d/99-netoholics-voip.conf, apply with
# `sysctl -p /etc/sysctl.d/99-netoholics-voip.conf`, then restart Asterisk:
# the IAX socket only takes the new buffer size when it is reopened.
net.core.rmem_default = 67108864
net.core.rmem_max = 67108864
net.core.netdev_max_backlog = 16384
