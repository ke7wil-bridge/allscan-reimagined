; Texas 674984 managed admission block. Merge at the radio-secure connect label.
; Local loopback bridge channels bypass the inbound radio count.
same => n,GotoIf($["${CHANNEL(peerip)}" = "127.0.0.1"]?asrplus-admit)
same => n,Set(GROUP(rptin)=${EXTEN})
same => n,GotoIf($[${GROUP_COUNT(${EXTEN}@rptin)} > 60]?asrplus-reject-cap)
same => n(asrplus-admit),Rpt(${EXTEN})
same => n(asrplus-reject-cap),Hangup()
