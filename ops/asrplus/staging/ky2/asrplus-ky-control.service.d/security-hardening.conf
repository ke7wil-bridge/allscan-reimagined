[Service]
# KY2 control must match the filesystem and privilege protections already used
# by Phoenix. Keep the existing ExecStart, timer, and masterhub-pull topology.
NoNewPrivileges=true
PrivateTmp=true
UMask=0077
ProtectHome=read-only
ProtectSystem=strict
ProtectClock=true
ProtectControlGroups=true
ProtectKernelModules=true
ProtectKernelTunables=true
LockPersonality=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadOnlyPaths=/etc/asrplus-ky-control.json /etc/asrplus /root/.ssh /var/lib/asterisk/astdb.txt /var/www/html/allscan
ReadWritePaths=/run/asrplus-ky /var/lib/asrplus-agent /var/lib/allscan-reimagined/admin /etc/asterisk /var/lib/asterisk
StateDirectory=asrplus-agent
StateDirectoryMode=0700
